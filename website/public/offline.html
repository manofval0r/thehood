<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No signal · Cybersecurity 300L</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root {
        color-scheme: dark;
        --background: #000000;
        --foreground: #ffffff;
        --muted: #9a9a9a;
        --accent: #22c55e;
        --surface: #0a0a0a;
        --border: #1f1f1f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 2rem;
        text-align: center;
      }
      .box {
        max-width: 30rem;
      }
      h1 {
        font-size: 1.5rem;
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      a {
        display: inline-block;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--foreground);
        text-decoration: none;
        border-radius: 0.5rem;
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
        font-weight: 600;
      }
      a:hover {
        border-color: var(--accent);
      }
      .mark {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p class="mark">Nutm Apapa · Cybersecurity 300L</p>
      <h1>No signal</h1>
      <p>
        This page needs the network, and there is none right now. The lecture
        notes you have already opened are still in the browser, and the
        timetable is on the way.
      </p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
